name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reuses the shape of the mori CI (sterility + ruff lint), adapted for the
# ENGINE tree: the load-bearing extra job is `typecheck` — `mypy --strict` is
# gated's signature quality bar — and `test` runs the unittest suite on a Python
# matrix. The suite is STDLIB-ONLY except for ONE vetted dependency on the
# security path: PyNaCl (libsodium Ed25519) — one does not roll one's own crypto
# (see gate/signing.py). Podman-gated tests (OCI / observed / demo-regression)
# self-skip when no runtime/image is present, so they are green-by-skip on hosted
# runners; the boundary mechanism is verified on real podman on a self-hosted runner, not here.

jobs:
  sterility:
    name: Content sterility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The mori project's sterility gate (adopted): a maintained MARKERS + ALLOW script
      # over `git ls-files`, replacing the brittle inline grep. Also catches pre-extraction
      # naming and env prefixes, so a de-baptism miss fails the build.
      - name: Content sterility (scripts/check-sterility.py)
        run: python scripts/check-sterility.py
      # 3.5-close #1.7: the scoped overclaim guard — fails CI if unsuppressed absolute-safety /
      # execution-assurance / guarantee language survives in shipped code strings or key docs.
      - name: Overclaim lint (scripts/check-overclaim.py)
        run: python scripts/check-overclaim.py
      # The published-voice guard: this is a solo project, so the prose says "I", never a corporate
      # "we" — which implies an organisation that does not exist and launders individual
      # accountability into a collective one. Published Markdown only; shipped code comments are
      # engineering prose and a MANUAL-review surface, a boundary the script states rather than
      # implies (so a green build is never read as "no first-person-plural anywhere").
      - name: Voice gate (scripts/check-voice.py)
        run: python scripts/check-voice.py

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ⚠ THE ENFORCEMENT ASSERTS ON WHAT IS TRACKED, NEVER ON .gitignore. A gitignore rule is a
      # guard against ACCIDENT: it does nothing about a file that is already in the index, and
      # `git add -f` ignores it entirely. Checking the guard instead of the property is the shape
      # this project has met repeatedly — a control that certifies its own precondition.
      - name: No generated or local-only artefact is TRACKED
        run: |
          set -uo pipefail
          # ⚠ `git ls-files` LISTS FILES, so a directory pattern must match a PATH COMPONENT and
          # never the end of the string: `.gitnexus/` appears as `.gitnexus/meta.json`. An
          # end-anchored directory pattern matches nothing and the gate passes vacuously.
          bad=$(git ls-files | grep -E \
            '(^|/)(\.gitnexus|__pycache__|\.venv|venv|node_modules|\.mypy_cache|\.ruff_cache|\.pytest_cache)/|(^|/)(\.env|\.secrets|\.DS_Store)$|\.py[cod]$' || true)
          if [ -n "$bad" ]; then
            echo "::error::these are tracked and must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "OK — no generated or local-only artefact is tracked"
      # The GUARD, checked separately and for a different reason: the rules above lived only in
      # .git/info/exclude, which is LOCAL AND NEVER COMMITTED, so every fresh clone was unprotected.
      # A repo that relies on an uncommitted exclude file is one `git add -A` from publishing.
      - name: .gitignore covers the denylist (so a FRESH CLONE is protected)
        run: |
          set -uo pipefail
          missing=""
          for p in ".gitnexus/" "__pycache__/" ".venv/" "node_modules/" ".env" ".secrets"; do
            grep -qxF -- "$p" .gitignore || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::.gitignore is missing:$missing"
            echo "these must be in the COMMITTED .gitignore, not in .git/info/exclude"
            exit 1
          fi
          echo "OK — .gitignore covers the denylist"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.15.15"
      - run: ruff check .

  typecheck:
    name: Types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "mypy==2.1.0"
      # ⚠ THE PACKAGE ARGV IS DERIVED FROM scripts/gate_coverage.json, NEVER RESTATED HERE. A
      # literal argv on this line is a second enumeration of the roster: correct the day it is
      # written, silently divergent the day only the other side is edited. That is exactly how
      # `demo` came to be type-checked here while check-overclaim.py never scanned it. GitHub
      # Actions does not parse the roster — the shell does, and print_gate_argv refuses to emit
      # anything if the roster fails its own partition check.
      - run: mypy --strict $(python scripts/print_gate_argv.py)

  test:
    name: Unit tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Zero third-party deps: the suite is stdlib-only. Podman-gated tests skip.
      - name: Install the one vetted security dependency (PyNaCl / libsodium Ed25519)
        run: pip install "pynacl==1.5.0"
      - name: unittest discover
        run: python -m unittest discover -s tests -v
